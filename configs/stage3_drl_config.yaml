# Parameters for the KG-based reinforcement learning environment.
env_args:
  # Path to the directory containing pre-trained KG embeddings from Stage 2.
  kg_embedding_dir: "./trained_models/stage2_transex_embeddings/"
  # The maximum number of steps (hops) an agent can take in one episode. From the paper.
  max_hops: 4
  # Number of top-k actions to consider at each step to prune the action space.
  action_pruning_k: 50

# -- Agent Arguments --
# Hyperparameters for the GAE-PPO agent.
agent_args:
  # Dimension of the state representation, should match KG embedding dim. From the paper.
  embedding_dim: 200
  # Discount factor for future rewards (gamma). From the paper.
  gamma: 0.99
  # The GAE lambda factor for advantage estimation. From the paper.
  gae_lambda: 0.95
  # The clipping parameter for the PPO objective function (epsilon).
  clip_eps: 0.2
  # Coefficient for the value function loss in the total loss (omega_v). From the paper.
  vf_coef: 0.5
  # Coefficient for the entropy regularization term (omega_h). From the paper.
  ent_coef: 0.01

# -- Training Arguments --
training_args:
  # Directory to save the trained DRL agent (policy and critic networks).
  output_dir: "./trained_models/stage3_drl_agent/"
  # Total number of training episodes. From the paper.
  num_episodes: 8000
  # Number of parallel agents (environments) for A3C-style training. From the paper.
  num_agents: 2
  # The batch size for updating the policy and value networks. From the paper.
  batch_size: 32
  # Learning rate for the Adam optimizer. From the paper.
  learning_rate: 0.0005 # 5e-4
  # Number of epochs to train on the collected data in each update.
  repeat_per_collect: 4
  # Frequency of logging training rewards and other metrics.
  log_every_episodes: 50
  # Device to use for training ('cpu' or 'cuda').
  device: "cuda"